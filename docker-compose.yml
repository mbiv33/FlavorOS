version: "3.9"

x-agent-base: &agent-base
  restart: unless-stopped
  environment:
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    POSTGRES_URL: postgres://flavor:${POSTGRES_PASSWORD}@postgres:5432/flavor
    OPENROUTER_BASE_URL: http://openrouter-proxy:8080/v1
    VAULT_PATH: /vault
    SECRETS_DIR: /run/flavor/secrets
  volumes:
    - ./vault:/vault
    - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
    - ./workspace:/workspace
    - secrets-tmpfs:/run/flavor/secrets:ro    # decrypted secrets (in-memory)
  depends_on:
    nats:              { condition: service_started }
    redis:             { condition: service_started }
    postgres:          { condition: service_started }
    openrouter-proxy:  { condition: service_started }
    secrets-loader:    { condition: service_healthy }
  networks: [flavor]

services:
  # ── Infrastructure ─────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    command: ["-js"]
    networks: [flavor]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [flavor]
    volumes: [redis-data:/data]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flavor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flavor
    volumes: [pg-data:/var/lib/postgresql/data]
    networks: [flavor]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [flavor]
    restart: unless-stopped

  secrets-loader:
    build: ./infra/secrets-loader
    container_name: secrets-loader
    volumes:
      - /etc/flavoros/age.key:/etc/flavoros/age.key:ro      # Layer 0 (host-only)
      - ./infra/secrets:/secrets:ro                          # Layer 1 (encrypted, git)
      - ./infra/composio.yaml:/secrets/composio.yaml:ro
      - secrets-tmpfs:/run/flavor/secrets                    # Layer 2 (tmpfs)
    tmpfs:
      - /run/flavor/secrets:size=16m,mode=0700
    healthcheck:
      test: ["CMD", "test", "-f", "/run/flavor/secrets/_shared/openrouter.key"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    networks: [flavor]

  openrouter-proxy:
    build: ./infra/openrouter-proxy
    environment:
      ROUTING_CONFIG: /etc/openrouter.yaml
      OPENROUTER_API_KEY_FILE: /run/flavor/secrets/_shared/openrouter.key
    volumes:
      - ./infra/openrouter.yaml:/etc/openrouter.yaml:ro
      - secrets-tmpfs:/run/flavor/secrets:ro
    depends_on:
      secrets-loader: { condition: service_healthy }
    networks: [flavor]
    restart: unless-stopped

  composio-init:
    build: ./infra/composio-init
    profiles: ["init"]                                       # only runs on `compose run --rm composio-init`
    environment:
      COMPOSIO_API_KEY_FILE: /run/flavor/secrets/khadijah/composio.key
    volumes:
      - ./infra/composio.yaml:/etc/flavoros/composio.yaml:ro
      - ./infra/secrets:/secrets:rw                          # writes connection_ids back
      - secrets-tmpfs:/run/flavor/secrets:ro
    depends_on:
      secrets-loader: { condition: service_healthy }
    networks: [flavor]
    stdin_open: true
    tty: true

  vault-sync:
    image: alpine/git
    command: ["sh", "/scripts/sync.sh"]
    environment:
      OBSIDIAN_GIT_REMOTE: ${OBSIDIAN_GIT_REMOTE}
    volumes:
      - ./vault:/vault
      - ./infra/vault-sync.sh:/scripts/sync.sh:ro
    restart: unless-stopped

  scheduler:
    build: ./infra/scheduler
    environment:
      NATS_URL: nats://nats:4222
      SCHEDULES: /etc/schedules.yaml
    volumes:
      - ./cron/schedules.yaml:/etc/schedules.yaml:ro
    depends_on: [nats]
    networks: [flavor]
    restart: unless-stopped

  # ── Agents ────────────────────────────────────────────────────────
  khadijah:
    <<: *agent-base
    build: ./agents/khadijah
    container_name: khadijah
    environment:
      AGENT_NAME: khadijah
      AGENT_ROLE: conductor
      KHADIJAH_DOMAIN: ${KHADIJAH_DOMAIN}
      # Secrets are read from files in /run/flavor/secrets/khadijah/
      # NOT from environment variables (avoids leaking via docker inspect).
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/khadijah/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./infra/voice.yaml:/etc/flavoros/voice.yaml:ro
      - ./skills:/skills:ro
      - secrets-tmpfs:/run/flavor/secrets:ro

  sinclair:
    <<: *agent-base
    build: ./agents/sinclair
    container_name: sinclair
    environment:
      AGENT_NAME: sinclair
      AGENT_ROLE: executive-assistant
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/sinclair/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/executive-assistant:/skills/executive-assistant:ro

  maxine:
    <<: *agent-base
    build: ./agents/maxine
    container_name: maxine
    environment:
      AGENT_NAME: maxine
      AGENT_ROLE: project-manager
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/maxine/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/daily-task-manager:/skills/daily-task-manager:ro
      - ./skills/daily-task-prep:/skills/daily-task-prep:ro

  kyle:
    <<: *agent-base
    build: ./agents/kyle
    container_name: kyle
    environment: { AGENT_NAME: kyle, AGENT_ROLE: finance-crm }
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/kyle/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/relationship-manager:/skills/relationship-manager:ro

  regine:
    <<: *agent-base
    build: ./agents/regine
    container_name: regine
    environment: { AGENT_NAME: regine, AGENT_ROLE: brand-social }
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/regine/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/brand-social:/skills/brand-social:ro

  scooter:
    <<: *agent-base
    build: ./agents/scooter
    container_name: scooter
    environment: { AGENT_NAME: scooter, AGENT_ROLE: travel-logistics }
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/scooter/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/travel-logistics:/skills/travel-logistics:ro

  watson:
    <<: *agent-base
    build: ./agents/watson
    container_name: watson
    environment: { AGENT_NAME: watson, AGENT_ROLE: wellness }
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/watson/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/wellness:/skills/wellness:ro

  overton:
    <<: *agent-base
    build: ./agents/overton
    container_name: overton
    environment: { AGENT_NAME: overton, AGENT_ROLE: infrastructure-ops }
    volumes:
      - ./vault:/vault
      - ./CHIEF_OF_STAFF_CONTEXT.md:/etc/flavoros/CHIEF_OF_STAFF_CONTEXT.md:ro
      - ./workspace:/workspace
      - ./agents/overton/agent.yaml:/etc/flavoros/agent.yaml:ro
      - ./skills/infrastructure-ops:/skills/infrastructure-ops:ro

volumes:
  redis-data:
  pg-data:
  caddy-data:
  secrets-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0700"

networks:
  flavor:
    driver: bridge
