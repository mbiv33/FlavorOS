# SOPS routing — which keys can decrypt which files.
# The age recipient(s) listed below are PUBLIC keys (safe in git).
# The matching PRIVATE key lives only on the VPS and in your password manager.

creation_rules:
  - path_regex: .*secrets\.yaml$
    encrypted_regex: '^(.*)$'   # encrypt every value
    # Add a second comma-separated recipient here during key rotation.
    age: age10gfqu4w7g4jw9dpqu254gzrm4w748qmwn7e3zvpssm3yqcllluaq2hukrl
