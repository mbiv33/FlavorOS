# Per-agent model routing through OpenRouter.
# The openrouter-proxy sidecar reads this and enforces caps + fallbacks.

defaults:
  provider: openrouter
  daily_token_cap: 2_000_000
  retry_on_rate_limit: true
  log_to: postgres://flavor@postgres/flavor#openrouter_calls

agents:
  khadijah:
    primary: anthropic/claude-sonnet-4.6
    fallback: anthropic/claude-sonnet-4.5
    daily_token_cap: 4_000_000   # hub gets the most headroom
    notes: synthesis + user interface; never falls below sonnet

  sinclair:
    profiles:
      thinking:
        primary: anthropic/claude-sonnet-4.6
        used_for: [draft_email, schedule_decision, conflict_resolution]
      crawl:
        primary: anthropic/claude-haiku-4.5
        used_for: [inbox_sweep, label_message, archive_decision]
    daily_token_cap: 3_000_000

  maxine:
    profiles:
      thinking:
        primary: anthropic/claude-sonnet-4.6
        used_for: [milestone_review, prioritization, goal_alignment]
      report:
        primary: anthropic/claude-haiku-4.5
        used_for: [task_file_diff, daily_prep, status_summary]
    daily_token_cap: 2_500_000

  kyle:
    primary: openai/gpt-5-mini
    fallback: anthropic/claude-haiku-4.5
    daily_token_cap: 1_500_000

  regine:
    primary: openai/gpt-5-mini
    fallback: anthropic/claude-haiku-4.5
    daily_token_cap: 1_000_000

  scooter:
    primary: openai/gpt-5-mini
    fallback: anthropic/claude-haiku-4.5
    daily_token_cap: 800_000

  watson:
    primary: openai/gpt-5-mini   # CONFIRM: user wrote "gpt 5.4 mini"
    fallback: anthropic/claude-haiku-4.5
    daily_token_cap: 800_000

  overton:
    primary: anthropic/claude-haiku-4.5   # CONFIRM: not in user's list, assigning haiku
    fallback: openai/gpt-5-mini
    daily_token_cap: 500_000

cost_breakers:
  warn_at_pct: 70
  pause_at_pct: 100
  notify: khadijah
