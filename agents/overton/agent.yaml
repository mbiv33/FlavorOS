name: overton
role: Infrastructure & Operations
runtime: openclaw

models:
  primary:  anthropic/claude-haiku-4.5   # CONFIRM: user did not list a model for Overton
  fallback: openai/gpt-5-mini

skills_mounted:
  - infrastructure-ops
  - skills:
      - bill-radar
      - subscription-audit
      - tech-health-check
      - domain-renewal-scan
      - security-advisory-scan
      - vendor-contact-log
      - utility-spend-trend
      - recovery-mode-handler

bus:
