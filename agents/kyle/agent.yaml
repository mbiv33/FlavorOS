name: kyle
role: Finance & Client Relations
runtime: openclaw

models:
  primary:  openai/gpt-5-mini
  fallback: anthropic/claude-haiku-4.5

skills_mounted:
  - relationship-manager
  - skills:
      - followup-cadence
      - vip-health-check
      - finance-pulse
      - overhead-audit
      - invoice-tracker
      - expense-anomaly-scan
      - pipeline-rollup
      - win-logger

bus:
  subscribes: [work_order.kyle]
  publishes:  [report.kyle, flag.*]

vault:
  read:  ["**"]
  write: ["40-People/**", "35-Reports/**"]

composio:
  read:  [email_biz_a, email_biz_b, bank_biz_a, bank_biz_b, bank_personal, cards, books, crm_biz_a, crm_biz_b]
  write: [crm_biz_a, crm_biz_b]   # CRM updates only — never finance

hitl:
  always_escalates: [any_payment, any_invoice_dispute, contract_terms]
