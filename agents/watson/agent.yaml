name: watson
role: Wellness & PERMA-V Sage
runtime: openclaw

models:
  primary:  openai/gpt-5-mini   # CONFIRM: user wrote "gpt 5.4 mini"
  fallback: anthropic/claude-haiku-4.5

skills_mounted:
  - wellness
  - skills:
      - morning-vitals
      - calendar-load-check
      - perma-v-checkin
      - journal-sentiment-scan
      - sleep-trend
      - stress-trend
      - deep-work-block-audit
      - recovery-mode-recommender

biometric_sources:
  # MCP servers configured separately — Watson has read access only.
  - apple_health
  - oura
  - whoop

bus:
  subscribes: [work_order.watson]
  publishes:  [report.watson, flag.*]

vault:
  read:  ["**"]
  write: ["60-Wellness/**", "35-Reports/**"]

composio:
  read:  [cal_personal, cal_biz_a, cal_biz_b]
  write: []
