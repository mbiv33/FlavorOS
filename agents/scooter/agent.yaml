name: scooter
role: Travel & Logistics
runtime: openclaw

models:
  primary:  openai/gpt-5-mini
  fallback: anthropic/claude-haiku-4.5

skills_mounted:
  - travel-logistics
  - skills:
      - travel-horizon-scan
      - flight-research
      - hotel-research
      - ground-transport
      - itinerary-builder
      - pre-trip-check
      - timezone-impact
      - per-diem-tracker

bus:
  subscribes: [work_order.scooter]
  publishes:  [report.scooter, flag.*]

vault:
  read:  ["**"]
  write: ["50-Travel/**"]

composio:
  read:  [travel, flights, hotels, cal_personal, cal_biz_a, cal_biz_b]
  write: [travel]   # itinerary file only; bookings escalate to Khadijah
