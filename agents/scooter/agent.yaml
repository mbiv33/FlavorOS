name: scooter
role: Chief Logistics Officer (CLO)
runtime: openclaw
soul: /etc/flavoros/SOUL.md
context: /etc/flavoros/FLAVOROS_CONTEXT.md

models:
  profiles:
    thinking: anthropic/claude-sonnet-4.6
    fast:     openai/gpt-5.4-mini
  routing_rules:
    - skill: travel-logistics
      args: { stakes: high }
      profile: thinking
    - skill: travel-logistics
      args: { multi_constraint: true }
      profile: thinking
    - skill: travel-logistics
      profile: fast
    - skill: tech-ops
      args: { stakes: high }
      profile: thinking
    - skill: tech-ops
      profile: fast
    - skill: briefing-coordination
      args: { stakes: high }
      profile: thinking
    - skill: briefing-coordination
      args: { multi_constraint: true }
      profile: thinking
    - skill: briefing-coordination
      profile: fast
    - skill: web-research
      args: { stakes: high }
      profile: thinking
    - skill: web-research
      args: { multi_constraint: true }
      profile: thinking
    - skill: web-research
      profile: fast
    - skill: logistics-research
      args: { stakes: high }
      profile: thinking
    - skill: logistics-research
      args: { multi_constraint: true }
      profile: thinking
    - skill: logistics-research
      profile: fast

skills_mounted:
  - travel-logistics
  - tech-ops
  - briefing-coordination
  - web-research
  - logistics-research
  - obsidian-logistics

plugins:
  obsidian:
    enabled: true
    bundles: [dataview, templater, tasks]
  web:
    enabled: true
    bundles: [browser, research]

obsidian:
  primary_folders: ["05-SIGMA", "15-Readiness", "20-Meetings", "35-Reports", "50-Travel", "70-Ops", "90-Archive"]
  templates: ["05-SIGMA/_templates/sigma.md", "15-Readiness/_templates/readiness-artifact.md", "20-Meetings/_templates/prep.md", "35-Reports/_templates/agent-report.md", "50-Travel/_templates/trip.md"]

bus:
  subscribes: [work_order.scooter]
  publishes:  [report.scooter, flag.*]

vault:
  read:  ["**"]
  write: ["05-SIGMA/**", "15-Readiness/**", "20-Meetings/**", "35-Reports/**", "50-Travel/**", "70-Ops/**"]

composio:
  read:  [travel, flights, hotels, cal_personal, cal_biz_a, cal_biz_b, email_personal]
  write: [travel]   # itinerary file only; bookings escalate to Khadijah
