name: scooter
role: Chief Logistics Officer (CLO)
runtime: openclaw
soul: /etc/flavoros/SOUL.md

models:
  primary:  openai/gpt-5-mini
  fallback: anthropic/claude-haiku-4.5

skills_mounted:
  - travel-logistics
  - tech-ops
  - briefing-coordination
  - web-research
  - logistics-research
  - obsidian-logistics

plugins:
  obsidian:
    enabled: true
    bundles: [dataview, templater, tasks]
  web:
    enabled: true
    bundles: [browser, research]

obsidian:
  primary_folders: ["20-Meetings", "35-Reports", "50-Travel", "70-Ops", "90-Archive"]
  templates: ["20-Meetings/_templates/prep.md", "35-Reports/_templates/agent-report.md", "50-Travel/_templates/trip.md"]

bus:
  subscribes: [work_order.scooter]
  publishes:  [report.scooter, flag.*]

vault:
  read:  ["**"]
  write: ["20-Meetings/**", "35-Reports/**", "50-Travel/**", "70-Ops/**"]

composio:
  read:  [travel, flights, hotels, cal_personal, cal_biz_a, cal_biz_b, email_personal]
  write: [travel]   # itinerary file only; bookings escalate to Khadijah
